<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneClick — UWB</title>
    <style>
        body {
            font-family: "Comfortaa", sans-serif;
            font-optical-sizing: auto;
            color: white;
            background: #141414;
            justify-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
        }
        .header-uwb {
            position: flex;
            top: 0;
            height: 20px;
            background: rgb(20, 20, 20);
            border: 2px solid white;
            border-radius: 25px;
            margin: 1em;
            display: block;
            text-align: center;
            padding: 10px;
            box-shadow: 0px 0px 1em 1em black;
        }
        
        .content {
            padding: 10%;
        }
       
        .header-uwb-title {
            font-weight: 800;
            font-style: normal;
            padding: 10px;
        }
        
        .getkeybtn {
            font-weight: bold;
            font-style: normal;
            font-size: 1.5em;
            width: fit-content;
            height: 5em;
            padding: 0.5em;
            display: block;
            border: 2px solid;
            border-radius: 1em;
            box-shadow: 0px 0px 1em 0.5em black;
            background: #141414;
            color: white;
            margin-top: 10%;
            transition: 0.5s all;
        }
        
        .getkeybtn:hover {
            background: white;
            color: black;
        }
        
        .description {
            color: #ccc;
            font-weight: 800;
            font-style: normal;
            display: block;
            border: 1px black;
            padding: 0.2em;
            margin: 0.5em;
            text-align: left;
        }
        table th,td {
            vertical-align: top;
        }
        table .description {
            color: white;
            /* text-align: right;
            padding-right: 1em; */
        }
        /* * {border: 1px red solid !important} */
        
        
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body bgcolor="black">
    <header class="header-uwb">
        <span class="header-uwb-title">— <pre style="display:inline"> </pre><i class="fa-solid fa-mouse-pointer"></i><pre style="display:inline"> </pre>OneClick V1.0 - UWB —</span>
    </header>
    <div class="content">
        <table>
            <tr>
                <th>
                    <span class="description"><i class="fa-solid fa-smile"></i> Проще некуда: Получение и копирование конфига одной кнопкой!</span>
                    <span class="description"><i class="fa-solid fa-clock"></i> Последнее обновление: <br/>
                    <span id="lastupdate"></span></span>
                </th> <th>
            <button class="getkeybtn" onclick="getcfg()">Получить конфиг</button>
                </th>
            </tr>
        </table>
        <span class="description" style="margin-top: 2em;"><i class="fa-solid fa-warning"></i> Конфиги могут быть нерабочими если обновление было более трёх дней назад.</span>
    </div>

    <script>
        fetch("https://api.github.com/repos/RYZgames31/UWB/commits")
            .then(response => response.json())
            .then(json => {
                commitsJSON = json;
                lastUpdated = commitsJSON[0]["commit"]["committer"]["date"];
                lastUpdatedDate = new Date(lastUpdated);
                document.getElementById('lastupdate').innerText = lastUpdatedDate.toLocaleString();
            })
        
        function getcfg(){
            fetch("https://raw.githubusercontent.com/RYZgames31/UWB/refs/heads/main/wcfg")
                .then(response => response.text())
                .then(text => {
                    wcfg = text;
                    wcfg = wcfg.split("\n");
                    wcfg = wcfg[Math.floor(Math.random()*wcfg.length)];
                    navigator.clipboard.writeText(wcfg);
        
                })
        }
    </script>
</body>
